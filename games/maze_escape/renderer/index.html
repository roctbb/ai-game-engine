<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maze Escape Renderer</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;width:100vw;height:100vh;display:grid;place-items:center;background:#0a0e17;font-family:"Segoe UI",Arial,sans-serif;color:#c8d6e5;overflow:hidden}
    .wrap{width:100vw;height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:8px;padding:12px}
    .board{display:block;width:100%;height:100%;min-height:0;border-radius:8px;overflow:hidden}
    .hud{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#94a3b8;flex-shrink:0}
    .hud b{color:#e2e8f0;font-weight:600}
    .hud .win{color:#4ade80}
  </style>
</head>
<body>
<div class="wrap">
  <svg id="board" class="board" role="img" aria-label="Лабиринт и положение игрока"></svg>
  <div class="hud" id="hud"></div>
</div>
<script>
const SVG="http://www.w3.org/2000/svg";
const boardEl=document.getElementById("board");
const hudEl=document.getElementById("hud");
let runId="",lastFrame=null,prevSteps=-1;
let sceneKey="", scene=null, movement=null;
let visual={x:0,y:0}, target={x:0,y:0};
const reducedMotion=window.matchMedia("(prefers-reduced-motion: reduce)");

/* ── SVG helpers ── */
function el(tag,attrs){const e=document.createElementNS(SVG,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,String(v));return e}
function rect(x,y,w,h,fill,extra){return el("rect",{x,y,width:w,height:h,fill,...(extra||{})})}
function circle(cx,cy,r,fill,extra){return el("circle",{cx,cy,r:Math.max(0,r),fill,...(extra||{})})}

/* ── Defs ── */
function addDefs(C){
  const d=el("defs",{});

  // ground
  const gp=el("pattern",{id:"gnd",width:C/2,height:C/2,patternUnits:"userSpaceOnUse"});
  gp.appendChild(rect(0,0,C/2,C/2,"#3b4a2e"));
  gp.appendChild(rect(C*0.06,C*0.08,1.5,1.5,"#4a5c38"));
  gp.appendChild(rect(C*0.32,C*0.38,1,1,"#344226"));
  d.appendChild(gp);

  // wall
  const wp=el("pattern",{id:"wll",width:C,height:C,patternUnits:"userSpaceOnUse"});
  wp.appendChild(rect(0,0,C,C,"#4a4f5c"));
  // brick lines
  wp.appendChild(el("line",{x1:0,y1:C*0.33,x2:C,y2:C*0.33,stroke:"#3d424e","stroke-width":0.8}));
  wp.appendChild(el("line",{x1:0,y1:C*0.66,x2:C,y2:C*0.66,stroke:"#3d424e","stroke-width":0.8}));
  wp.appendChild(el("line",{x1:C*0.5,y1:0,x2:C*0.5,y2:C*0.33,stroke:"#3d424e","stroke-width":0.8}));
  wp.appendChild(el("line",{x1:0,y1:C*0.33,x2:0,y2:C*0.66,stroke:"#3d424e","stroke-width":0.8}));
  wp.appendChild(el("line",{x1:C*0.5,y1:C*0.66,x2:C*0.5,y2:C,stroke:"#3d424e","stroke-width":0.8}));
  // highlight
  wp.appendChild(rect(1,1,C*0.48,C*0.31,"#545a68",{opacity:0.25,rx:1}));
  d.appendChild(wp);

  // exit glow
  const eg=el("radialGradient",{id:"exG",cx:"50%",cy:"50%",r:"60%"});
  eg.appendChild(el("stop",{offset:"0%","stop-color":"#4ade80","stop-opacity":0.9}));
  eg.appendChild(el("stop",{offset:"100%","stop-color":"#166534","stop-opacity":0.3}));
  d.appendChild(eg);

  // torch radial
  const tg=el("radialGradient",{id:"torch",cx:"50%",cy:"50%",r:"50%"});
  tg.appendChild(el("stop",{offset:"0%","stop-color":"#fbbf24","stop-opacity":0.22}));
  tg.appendChild(el("stop",{offset:"60%","stop-color":"#f97316","stop-opacity":0.08}));
  tg.appendChild(el("stop",{offset:"100%","stop-color":"#000","stop-opacity":0}));
  d.appendChild(tg);

  // fog overlay
  const fg=el("radialGradient",{id:"fog",cx:"50%",cy:"50%",r:"50%"});
  fg.appendChild(el("stop",{offset:"0%","stop-color":"#000","stop-opacity":0}));
  fg.appendChild(el("stop",{offset:"55%","stop-color":"#000","stop-opacity":0}));
  fg.appendChild(el("stop",{offset:"85%","stop-color":"#0a0e17","stop-opacity":0.7}));
  fg.appendChild(el("stop",{offset:"100%","stop-color":"#0a0e17","stop-opacity":0.92}));
  d.appendChild(fg);

  boardEl.appendChild(d);
}

/* ── Hero sprite ── */
function drawHero(cx,cy,C,dir,tick,moving){
  const g=el("g",{transform:`translate(${cx} ${cy})`});
  const angles={right:0,down:90,left:180,up:-90};
  const a=angles[dir]||0;
  const bob=moving?Math.sin(tick*0.7)*C*0.04:0;

  const body=el("g",{transform:`rotate(${a}) translate(0 ${bob})`});

  const bw=C*0.28,bh=C*0.34;
  // shadow
  body.appendChild(el("ellipse",{cx:0,cy:bh*0.4,rx:C*0.22,ry:C*0.08,fill:"#000",opacity:0.3}));
  // torso
  body.appendChild(rect(-bw/2,-bh*0.1,bw,bh,"#2563eb",{rx:2,ry:2}));
  // belt
  body.appendChild(rect(-bw/2+1,bh*0.55,bw-2,bh*0.12,"#1e40af",{rx:1}));
  // head
  const hr=C*0.11;
  body.appendChild(circle(0,-bh*0.42,hr,"#f5d0a9"));
  // eyes
  body.appendChild(circle(-hr*0.3,-bh*0.45,C*0.022,"#1e293b"));
  body.appendChild(circle(hr*0.3,-bh*0.45,C*0.022,"#1e293b"));

  // torch stick
  const sx=bw*0.45,sy=-bh*0.35;
  body.appendChild(rect(sx,sy,C*0.05,C*0.2,"#78350f",{rx:1,transform:"rotate(20)"}));
  // flame
  const flame=circle(sx+C*0.06,sy-C*0.04,C*0.065,"#fb923c",{opacity:0.95});
  const fa=el("animate",{attributeName:"r",values:`${C*0.05};${C*0.08};${C*0.05}`,dur:"0.6s",repeatCount:"indefinite"});
  if(!reducedMotion.matches)flame.appendChild(fa);
  const fc=el("animate",{attributeName:"fill",values:"#fb923c;#facc15;#f97316;#fb923c",dur:"0.7s",repeatCount:"indefinite"});
  if(!reducedMotion.matches)flame.appendChild(fc);
  body.appendChild(flame);
  // flame tip
  body.appendChild(circle(sx+C*0.06,sy-C*0.09,C*0.035,"#fde68a",{opacity:0.6}));

  g.appendChild(body);
  return g;
}

/* Static tiles and the sprite survive state updates; only positions and HUD change. */
function placeHero(x,y){
  visual={x,y};
  if(!scene)return;
  scene.hero.setAttribute("transform",`translate(${x} ${y})`);
  scene.torch.setAttribute("cx",x);scene.torch.setAttribute("cy",y);
  scene.fogHole.setAttribute("cx",x);scene.fogHole.setAttribute("cy",y);
}
function moveHero(x,y,duration){
  if(movement!==null)cancelAnimationFrame(movement);
  movement=null;target={x,y};
  if(reducedMotion.matches||!duration||Math.hypot(x-visual.x,y-visual.y)>48){placeHero(x,y);return}
  const from={...visual},started=performance.now();
  function animate(now){
    const progress=Math.min(1,(now-started)/duration), eased=1-Math.pow(1-progress,3);
    placeHero(from.x+(x-from.x)*eased,from.y+(y-from.y)*eased);
    movement=progress<1?requestAnimationFrame(animate):null;
  }
  movement=requestAnimationFrame(animate);
}
function draw(frame,motion={}){
  const grid=Array.isArray(frame.maze)?frame.maze:[];
  const W=frame.size?.width||grid.length||21,H=frame.size?.height||grid[0]?.length||21,C=32;
  const walls=new Set();
  if(Array.isArray(frame.walls))for(const wall of frame.walls)if(wall&&Number.isFinite(wall.x))walls.add(wall.x+","+wall.y);
  if(!walls.size&&grid.length)for(let x=0;x<W;x++)for(let y=0;y<H;y++)if(grid[x]?.[y]===-1)walls.add(x+","+y);
  const ex=frame.exit?.x||0,ey=frame.exit?.y||0;
  const key=JSON.stringify([W,H,ex,ey,[...walls].sort()]);
  const changed=key!==sceneKey;
  if(changed){
    sceneKey=key;boardEl.replaceChildren();boardEl.setAttribute("viewBox",`0 0 ${W*C} ${H*C}`);addDefs(C);
    const tiles=el("g",{"data-layer":"tiles"});
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const wall=walls.has(x+","+y);
      tiles.appendChild(rect(x*C,y*C,C,C,wall?"url(#wll)":"url(#gnd)"));
      if(wall&&y>0&&!walls.has(x+","+(y-1)))tiles.appendChild(rect(x*C,y*C,C,2,"#6b7280",{opacity:.5}));
    }
    tiles.appendChild(rect(ex*C,ey*C,C,C,"url(#exG)"));
    const doorW=C*.5,doorH=C*.65,doorX=ex*C+(C-doorW)/2,doorY=ey*C+(C-doorH)*.8;
    tiles.appendChild(rect(doorX,doorY,doorW,doorH,"#166534",{rx:doorW/2,opacity:.7}));
    tiles.appendChild(rect(doorX+2,doorY+2,doorW-4,doorH-2,"#22c55e",{rx:(doorW-4)/2,opacity:.4}));
    boardEl.appendChild(tiles);
    const torch=el("ellipse",{cx:0,cy:0,rx:C*2.5,ry:C*2.5,fill:"url(#torch)",opacity:.8});
    const hero=drawHero(0,0,C,"right",0,false);
    hero.setAttribute("data-layer","hero");
    boardEl.append(torch,hero);
    const fogHole=circle(0,0,C*4.5,"black"),mask=el("mask",{id:"fogM"});
    mask.append(rect(0,0,W*C,H*C,"white"),fogHole);
    boardEl.append(mask,rect(0,0,W*C,H*C,"#0a0e17",{opacity:.75,mask:"url(#fogM)"}));
    scene={hero,torch,fogHole};
  }
  const x=(frame.position?.x||0)*C+C/2,y=(frame.position?.y||0)*C+C/2;
  const angle=({right:0,down:90,left:180,up:-90})[frame.direction]||0;
  scene.hero.firstElementChild.setAttribute("transform",`rotate(${angle})`);
  moveHero(x,y,changed?0:Math.max(0,Math.min(220,Number(motion.duration_ms)||0)));
  const metrics=[`Шаги: ${frame.steps||0}`];
  if(Number.isFinite(frame.optimal_steps))metrics.push(`Оптимум: ${frame.optimal_steps}`);
  if(Number.isFinite(frame.score))metrics.push(`Счёт: ${frame.score}`);
  if(frame.reached_exit)metrics.push("Выход найден");
  if(frame.invalid_moves)metrics.push(`Неверных ходов: ${frame.invalid_moves}`);
  const text=metrics.join(" · ");if(hudEl.textContent!==text)hudEl.textContent=text;
}

/* ── Message protocol ── */
window.addEventListener("message",e=>{
  const m=e.data;
  if(!m||typeof m!=="object"||typeof m.type!=="string")return;
  if(m.type==="agp.renderer.init"){
    runId=m.payload?.runId||"";prevSteps=-1;
  }else if(m.type==="agp.renderer.state"){
    lastFrame=m.payload||{};
    draw((lastFrame&&typeof lastFrame.frame==="object")?lastFrame.frame:{},lastFrame.motion);
  }else if(m.type==="agp.renderer.result"){
    /* keep last drawn frame */
  }
});

reducedMotion.addEventListener("change",()=>{
  if(reducedMotion.matches){if(movement!==null)cancelAnimationFrame(movement);movement=null;placeHero(target.x,target.y);boardEl.pauseAnimations()}
  else boardEl.unpauseAnimations();
});

draw({position:{x:1,y:1},size:{width:31,height:31},walls:[],exit:{x:29,y:29},direction:"right",steps:0});
window.parent.postMessage({type:"agp.renderer.ready",payload:{version:"2.0.0"}},"*");
</script>
<script src="/game-renderer-ui.js"></script></body>
</html>
