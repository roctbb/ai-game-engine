<!doctype html>
<html lang="ru" data-agp-enhanced="true"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Ключи и ворота — игровое поле</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:12px;width:100vw;height:100vh;background:#0b1421;color:#e4edf9;font:13px/1.5 system-ui,sans-serif}.wrap{height:100%;display:flex;flex-direction:column;gap:10px}.map{position:relative;flex:1;min-height:0;display:grid;place-items:center}svg{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}#hud,.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}#hud span{padding:5px 9px;background:#18273b;border:1px solid #2c4059;border-radius:7px}#hud b{margin-left:5px;color:white;font-variant-numeric:tabular-nums}.legend{color:#a3b6cd;font-size:11px}.legend span{display:flex;gap:5px;align-items:center}.swatch{width:10px;height:10px;border-radius:2px;background:var(--color)}#hint{color:#9eb3cd;min-height:20px;font-size:12px}#tooltip{position:absolute;top:8px;left:8px;padding:5px 8px;background:#06101ee8;border:1px solid #476181;border-radius:6px;color:#e8f1fc;pointer-events:none}.bot{transition:transform 140ms ease-out}.cell{transition:fill 160ms ease-out}.selected{stroke:#dbeafe;stroke-width:2;pointer-events:none}@media(prefers-reduced-motion:reduce){.bot,.cell{transition:none!important}}
</style></head><body><div class="wrap"><div class="map"><svg id="board" role="img" aria-label="Лабиринт: соберите ключи, откройте ворота и доберитесь до выхода"></svg><div id="tooltip" hidden></div></div><div id="hud" aria-live="polite"></div><div id="hint">Синий круг — ваш бот. Координаты клетки появятся при наведении.</div><div class="legend"><span><i class="swatch" style="--color:#fbbf24"></i>Ключ</span><span><i class="swatch" style="--color:#d97881"></i>Ворота · нужен 1 ключ</span><span><i class="swatch" style="--color:#2dd4bf"></i>Выход</span><span><i class="swatch" style="--color:#60a5fa"></i>Ваш бот</span></div></div>
<script>
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('board'),hud=document.getElementById('hud'),hint=document.getElementById('hint'),tooltip=document.getElementById('tooltip'),C=32;
let width=0,height=0,cells=[],objects=[],values=[],bot=null,selection=null,previous=null,lastAt=0;
function el(tag,attrs={},text){const n=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,String(v)));if(text!==undefined)n.textContent=text;return n}
function initialise(w,h){width=w;height=h;svg.setAttribute('viewBox',`0 0 ${w*C} ${h*C}`);svg.replaceChildren();cells=[];objects=[];values=[];for(let x=0;x<w;x++){cells[x]=[];objects[x]=[];values[x]=[];for(let y=0;y<h;y++){const r=el('rect',{x:x*C+1,y:y*C+1,width:C-2,height:C-2,rx:3,fill:'#18283c',class:'cell'});cells[x][y]=r;svg.append(r);const g=el('g',{'pointer-events':'none'});objects[x][y]=g;svg.append(g)}}bot=el('g',{class:'bot','pointer-events':'none'});bot.append(el('circle',{cx:C/2,cy:C/2,r:10,fill:'#60a5fa',stroke:'#e0f2fe','stroke-width':2}),el('circle',{cx:C/2,cy:C/2,r:3,fill:'#173656'}));svg.append(bot);selection=el('rect',{width:C-2,height:C-2,rx:3,fill:'none',class:'selected',visibility:'hidden'});svg.append(selection)}
function updateCell(x,y,value){if(values[x][y]===value)return;values[x][y]=value;const g=objects[x][y];g.replaceChildren();cells[x][y].setAttribute('fill',value===-1?'#34445c':value===-2?'#643d50':value===1?'#473c23':value===2?'#153f40':'#18283c');if(value===1){g.append(el('circle',{cx:x*C+12,cy:y*C+13,r:5,fill:'none',stroke:'#fbbf24','stroke-width':2.5}),el('path',{d:`M${x*C+16} ${y*C+17}l7 7m-3-3 3-3`,fill:'none',stroke:'#fbbf24','stroke-width':2.5}))}if(value===-2){g.append(el('rect',{x:x*C+10,y:y*C+14,width:12,height:10,rx:2,fill:'#e6a1a7'}),el('path',{d:`M${x*C+12} ${y*C+14}v-3a4 4 0 0 1 8 0v3`,fill:'none',stroke:'#e6a1a7','stroke-width':2}))}if(value===2){g.append(el('circle',{cx:x*C+16,cy:y*C+16,r:10,fill:'none',stroke:'#2dd4bf','stroke-width':2}),el('path',{d:`M${x*C+10} ${y*C+16}h11m-4-4 4 4-4 4`,fill:'none',stroke:'#2dd4bf','stroke-width':2}))}}
function draw(frame,tick=0,duration=0){const board=Array.isArray(frame.board)?frame.board:[],w=board.length||22,h=Array.isArray(board[0])?board[0].length:18;if(w!==width||h!==height)initialise(w,h);for(let x=0;x<w;x++)for(let y=0;y<h;y++)updateCell(x,y,board[x]?.[y]??0);const p=frame.position||{};if(Number.isFinite(p.x)&&Number.isFinite(p.y)){const now=performance.now(),smooth=previous&&tick===previous.tick+1&&duration>0;bot.style.transition=smooth?`transform ${Math.min(180,duration)}ms ease-out`:'none';bot.style.transform=`translate(${p.x*C}px, ${p.y*C}px)`;lastAt=now}const pairs=[['Ход',tick],['Ключей',frame.keys??0],['Собрано',frame.keys_collected??0]];if(frame.score!==undefined)pairs.push(['Счёт',frame.score]);hud.replaceChildren(...pairs.map(([label,value])=>{const s=document.createElement('span');s.textContent=label;const b=document.createElement('b');b.textContent=value;s.append(b);return s}));hint.textContent=frame.escaped?'Выход достигнут!':previous&&tick===previous.tick+1&&Number(frame.keys_collected)>Number(previous.frame.keys_collected)?'Подобран ключ. Теперь можно открыть ещё одни ворота.':previous&&tick===previous.tick+1&&Number(frame.keys)<Number(previous.frame.keys)?'Ворота открыты: потрачен один ключ.':previous&&tick===previous.tick+1&&Number(frame.invalid_moves)>Number(previous.frame.invalid_moves)?'Ход заблокирован. Посмотрите события повтора.':'Наведите на клетку, чтобы увидеть координаты и тип объекта.';previous={tick,frame}}
svg.addEventListener('pointermove',event=>{const matrix=svg.getScreenCTM();if(!matrix)return;const point=new DOMPoint(event.clientX,event.clientY).matrixTransform(matrix.inverse()),x=Math.floor(point.x/C),y=Math.floor(point.y/C);if(x<0||y<0||x>=width||y>=height){tooltip.hidden=true;selection.setAttribute('visibility','hidden');return}const v=values[x][y],name=v===-1?'Стена':v===-2?'Ворота · нужен ключ':v===1?'Ключ':v===2?'Выход':'Свободная клетка';tooltip.textContent=`(${x}, ${y}) · ${name}`;tooltip.hidden=false;selection.setAttribute('x',x*C+1);selection.setAttribute('y',y*C+1);selection.setAttribute('visibility','visible')});svg.addEventListener('pointerleave',()=>{tooltip.hidden=true;selection.setAttribute('visibility','hidden')});
window.addEventListener('message',event=>{const m=event.data;if(event.source===window.parent&&m?.type==='agp.renderer.state')draw(m.payload?.frame||{},Number(m.payload?.tick??0),Number(m.payload?.motion?.duration_ms||0))});
window.addEventListener('keydown',event=>{if(['Space','ArrowLeft','ArrowRight','Digit1','Digit2','Digit3'].includes(event.code)&&!event.ctrlKey&&!event.metaKey&&!event.altKey){event.preventDefault();window.parent.postMessage({type:'agp.renderer.shortcut',payload:{code:event.code,key:event.key}},'*')}});
draw({board:Array.from({length:22},()=>Array(18).fill(0)),position:{x:1,y:1},keys:0});window.parent.postMessage({type:'agp.renderer.ready',payload:{version:'1.0.0'}},'*');
</script></body></html>
