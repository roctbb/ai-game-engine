id: bomb_arena_v1
title: Бомбовая арена
game_mode: multiplayer
min_players_per_match: 2
max_players_per_match: 4
semver: 1.0.0
code_api_mode: script_based
engine_entrypoint: engine.py
renderer_entrypoint: renderer/index.html
player_instruction: 'Напишите make_move(state): верните {"move": "right", "bomb": true}. Бомба ставится до движения и взрывается через 5 ходов. Останьтесь последней выжившей командой.'
description: Разрушайте ящики, собирайте усиления и заманивайте соперников под цепные взрывы. В конце матча арена сжимается.
difficulty: hard
learning_section: Соревновательные стратегии
topics:
  - стратегия
  - поиск пути
  - симуляция
slots:
  - key: player
    title: Код команды
    required: true
demo_strategies:
  - id: safe_bomber
    slot_key: player
    title: 'Демо: бомбы с путём отхода'
    language: python
    path: examples/safe_bomber.py
    description: Ищет безопасный путь во времени и ставит бомбу только при наличии пути отхода.
